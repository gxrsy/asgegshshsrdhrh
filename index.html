<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Community Forum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #1f2937; }
        .container { max-width: 750px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1, h2, h3 { margin-top: 0; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .author { font-size: 0.85em; color: #6b7280; }
        .comment { background: #f9fafb; padding: 10px; border-radius: 6px; margin-top: 8px; border-left: 3px solid var(--primary); }
        .hidden { display: none; }
        .badge { background: #e0e7ff; color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h1>Global Forum</h1>

    <!-- Auth View -->
    <div class="card">
        <div id="authForms">
            <h2>Sign In / Register</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleAuth('signUp')">Register</button>
            <button onclick="handleAuth('signIn')" style="background: #10b981;">Log In</button>
        </div>
        <div id="userInfo" class="hidden">
            <p>Signed in as <strong id="userEmail"></strong> <span class="badge">Online</span></p>
            <button onclick="signOut()" style="background: #ef4444;">Log Out</button>
        </div>
    </div>

    <!-- Create Post -->
    <div id="postFormCard" class="card hidden">
        <h2>Create a Post</h2>
        <input type="text" id="postTitle" placeholder="Title">
        <textarea id="postContent" rows="3" placeholder="What's on your mind?"></textarea>
        <button onclick="createPost()">Publish Post</button>
    </div>

    <!-- Live Feed -->
    <h2>Recent Discussions</h2>
    <div id="postsFeed">Loading posts...</div>
</div>

<script>
    // Replace with your Supabase details
    const SUPABASE_URL = 'https://guhkpwmxndkrrdpsqkks.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LLe0i2kWHEGKjNwQr5QsgQ_P5GbannA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        updateUserSession(session?.user || null);

        supabase.auth.onAuthStateChange((_event, session) => {
            updateUserSession(session?.user || null);
        });

        fetchPosts();
    }

    function updateUserSession(user) {
        currentUser = user;
        if (user) {
            document.getElementById('authForms').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('postFormCard').classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;
        } else {
            document.getElementById('authForms').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('postFormCard').classList.add('hidden');
        }
    }

    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = type === 'signUp' 
            ? await supabase.auth.signUp({ email, password })
            : await supabase.auth.signInWithPassword({ email, password });

        if (error) alert(error.message);
        else if (type === 'signUp') alert('Check your email for confirmation!');
    }

    async function signOut() {
        await supabase.auth.signOut();
    }

    async function createPost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        if (!title || !content) return alert('Please complete all fields');

        const { error } = await supabase.from('posts').insert([{
            title,
            content,
            author_name: currentUser.email.split('@')[0],
            user_id: currentUser.id
        }]);

        if (error) alert(error.message);
        else {
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            fetchPosts();
        }
    }

    async function fetchPosts() {
        const { data: posts, error } = await supabase
            .from('posts')
            .select('*, comments(*)')
            .order('created_at', { ascending: false });

        if (error) return console.error(error);

        const feed = document.getElementById('postsFeed');
        feed.innerHTML = posts.map(post => `
            <div class="card">
                <h3>${escapeHtml(post.title)}</h3>
                <p>${escapeHtml(post.content)}</p>
                <div class="author">By <strong>${escapeHtml(post.author_name)}</strong> • ${new Date(post.created_at).toLocaleDateString()}</div>
                <br>
                <button onclick="likePost(${post.id}, ${post.likes})" style="background:#6b7280;">❤️ ${post.likes} Likes</button>
                <hr style="border:0; border-top:1px solid #e5e7eb; margin:15px 0;">
                <h4>Comments</h4>
                <div>
                    ${post.comments.map(c => `
                        <div class="comment"><strong>${escapeHtml(c.author_name)}:</strong> ${escapeHtml(c.content)}</div>
                    `).join('') || '<p class="author">No comments yet.</p>'}
                </div>
                ${currentUser ? `
                    <div style="margin-top:10px;">
                        <input type="text" id="comment-${post.id}" placeholder="Write a comment...">
                        <button onclick="addComment(${post.id})">Comment</button>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    async function likePost(id, currentLikes) {
        await supabase.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
        fetchPosts();
    }

    async function addComment(postId) {
        const input = document.getElementById(`comment-${postId}`);
        if (!input.value) return;

        await supabase.from('comments').insert([{
            post_id: postId,
            content: input.value,
            author_name: currentUser.email.split('@')[0]
        }]);
        
        fetchPosts();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    init();
</script>
</body>
</html>
